org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# media3 1.11.0 requires compileSdk 36, which is one ahead of what AGP 8.7.3 claims to
# support. The combination builds and runs; this silences a warning that would otherwise
# be printed on every build and trained into being ignored.
android.suppressUnsupportedCompileSdk=36
